  <title>Semi Nur Erdoğan</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f7f2ea;
      --bg2:#ede6d5;
      --gold:#9a6f2a;
      --gold2:#b8860b;
      --cream:#1a1208;
      --muted:#6b5a3e;
      --line:rgba(154,111,42,.18);
      --card-bg:rgba(154,111,42,.06);
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--cream);font-family:'Crimson Pro',serif;font-size:18px;line-height:1.75}
    nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 3rem;background:linear-gradient(to bottom,rgba(247,242,234,.97),rgba(247,242,234,.8),transparent)}
    .nav-logo{font-family:'Playfair Display',serif;color:var(--gold);text-decoration:none;font-style:italic;letter-spacing:.1em}
    .nav-links{display:flex;align-items:center;gap:1.5rem;list-style:none}
    .nav-links a,.lang-btn{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;background:none;border:none;cursor:pointer}
    .nav-links a:hover,.lang-btn:hover{color:var(--gold2)}
    .lang-wrap{display:flex;border:1px solid var(--line);overflow:hidden}
    .lang-btn{padding:.35rem .7rem}
    .lang-btn.active{background:var(--gold);color:#fff}
    .nav-right{display:flex;align-items:center;gap:1.5rem}
    .nav-links a.active{color:var(--gold2)}
    .nav-toggle{display:none;background:none;border:1px solid var(--line);color:var(--gold);font-family:'DM Mono',monospace;font-size:.85rem;padding:.3rem .6rem;cursor:pointer}
    section{padding:4.5rem 3rem;position:relative}
    section.view{display:none;padding-top:7rem;min-height:70vh}
    section.view.active{display:block;animation:viewFade .4s ease}
    #hero.view.active{display:flex}
    @keyframes viewFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .section-header{display:flex;align-items:center;gap:1rem;margin-bottom:2.5rem}
    .section-num{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--gold);letter-spacing:.12em}
    .section-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3.6vw,2.7rem)}
    .section-rule{flex:1;height:1px;background:var(--line);max-width:200px}
    #hero{min-height:100vh;flex-direction:column;justify-content:center;padding-top:5rem;background-image:url('background.png');background-size:cover;background-position:center;position:relative}
    #hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(247,242,234,.93) 55%,rgba(247,242,234,.5))}
    #hero>*{position:relative;z-index:1}
    .hero-eyebrow{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:1.4rem}
    .hero-name{font-family:'Playfair Display',serif;font-size:clamp(3.2rem,9vw,7rem);line-height:.92;margin-bottom:1.8rem}
    .hero-name em{font-style:italic;color:var(--gold2)}
    .hero-tagline{max-width:600px;font-size:clamp(1rem,2vw,1.2rem);color:var(--muted)}
    .hero-cta{display:flex;gap:1rem;margin-top:2rem;flex-wrap:wrap}
    .btn{display:inline-block;padding:.8rem 1.5rem;text-decoration:none;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
    .btn-primary{background:var(--gold);color:#fff}
    .btn-secondary{border:1px solid var(--line);color:var(--cream)}
    #about,#skills,#contact{background:var(--bg2)}
    #about{padding-bottom:3rem}
    .about-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:3rem;align-items:start}
    .about-body p{margin-bottom:1rem;color:var(--muted);font-size:1.08rem}
    .about-body p:empty{display:none}
    .card-stack{display:grid;gap:1rem}
    .card{border:1px solid var(--line);background:var(--card-bg);padding:1.2rem 1.3rem}
    .card-label{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.35rem}
    .card-value{color:var(--cream)}
    .card-value small{display:block;color:var(--muted);margin-top:.2rem}
    .projects-list,.experience-list{display:flex;flex-direction:column}
    .project,.exp-card{display:grid;grid-template-columns:90px 1fr;gap:1.5rem;padding:1.8rem 0;border-top:1px solid var(--line)}
    .project:last-child,.exp-card:last-child{border-bottom:1px solid var(--line)}
    .project-year,.exp-year{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--gold);letter-spacing:.1em;padding-top:.2rem}
    .project-tag{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.5rem}
    .project-name,.exp-title{font-family:'Playfair Display',serif;font-size:1.55rem;margin-bottom:.5rem}
    .project-desc,.exp-desc{color:var(--muted);max-width:600px}
    .exp-sub{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:.5rem}
    .pills{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}
    .pill{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:.22rem .55rem;border:1px solid var(--line);color:var(--muted)}
    .status{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:.22rem .55rem;border:1px solid var(--line);color:var(--muted);display:inline-block;margin-top:.8rem}
    .status.wip{color:var(--gold);border-color:rgba(154,111,42,.35)}
    .status.demo{background:var(--gold);color:#fff;border-color:var(--gold);text-decoration:none;margin-left:.4rem}
    .status.demo-ph{color:var(--gold);border-color:rgba(154,111,42,.35);margin-left:.4rem}
    .project-name a{color:inherit;text-decoration:none;transition:color .2s}
    .project-name a:hover{color:var(--gold2)}
    .project-more{display:inline-block;margin-top:1rem;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none}
    .project-more:hover{color:var(--gold2)}
    #project-detail{display:none}
    .back-btn{display:inline-block;margin-bottom:1.6rem;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none}
    .back-btn:hover{color:var(--gold2)}
    .detail-name{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.6rem);margin:.4rem 0 1rem}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:2.2rem 0}
    .detail-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}
    .detail-grid p{color:var(--muted)}
    .media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;margin-top:1rem}
    .media-ph{border:1px solid var(--line);background:var(--card-bg);min-height:160px;display:flex;flex-direction:column;gap:.55rem;align-items:center;justify-content:center;text-align:center;padding:1.2rem}
    .ph-icon{font-size:1.5rem;color:var(--gold2);opacity:.85;line-height:1}
    .ph-main{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
    .ph-sub{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .music-intro{color:var(--muted);max-width:600px;margin:-1rem 0 2.5rem}
    .music-list{display:flex;flex-direction:column}
    .track{display:grid;grid-template-columns:320px 1fr;gap:1.5rem;align-items:start;padding:1.8rem 0;border-top:1px solid var(--line)}
    .track:last-child{border-bottom:1px solid var(--line)}
    .track-embed .media-ph{min-height:120px}
    .track-embed iframe{max-width:100%}
    .track-title{font-family:'Playfair Display',serif;font-size:1.25rem;margin-bottom:.4rem}
    .track-context{color:var(--muted)}
    .skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2rem}
    .skill-group h3{font-family:'Playfair Display',serif;font-size:1.06rem;color:var(--gold2);font-style:italic;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
    .skill-item{margin-bottom:1rem}
    .skill-top{display:flex;justify-content:space-between;gap:1rem;margin-bottom:.35rem}
    .skill-name{color:var(--cream)}
    .skill-level{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--gold)}
    .contact-wrap{max-width:700px}
    .contact-big{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.8rem);line-height:1.1;margin-bottom:1rem}
    .contact-big em{font-style:italic;color:var(--gold2)}
    .contact-sub{max-width:520px;color:var(--muted);margin-bottom:2rem}
    .contact-btns{display:flex;gap:1rem;flex-wrap:wrap}
    .cta-link{display:inline-flex;align-items:center;gap:.7rem;padding:.8rem 1.4rem;border:1px solid var(--line);color:var(--cream);text-decoration:none;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
    .cta-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
    #writings{background:var(--bg)}
    .writings-list{display:flex;flex-direction:column}
    .writing-card{display:grid;grid-template-columns:100px 1fr auto;gap:1.5rem;padding:2.2rem 0;border-top:1px solid var(--line);text-decoration:none}
    .writing-card:last-child{border-bottom:1px solid var(--line)}
    .writing-card:hover .writing-title{color:var(--gold2)}
    .writing-date{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--gold);letter-spacing:.1em;padding-top:.25rem;line-height:1.6}
    .writing-tag{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.6rem}
    .writing-title{font-family:'Playfair Display',serif;font-size:1.7rem;margin-bottom:.5rem;color:var(--cream);transition:color .2s}
    .writing-excerpt{color:var(--muted);font-size:1.08rem}
    .writing-abstract{color:var(--muted);font-size:.95rem;font-style:italic;margin-top:.6rem;padding-left:.9rem;border-left:2px solid var(--line);max-width:600px}
    .writing-arrow{font-size:1.3rem;color:var(--gold);align-self:center;opacity:0;transition:opacity .2s,transform .2s}
    .writing-card:hover .writing-arrow{opacity:1;transform:translateX(4px)}
    footer{padding:1.5rem 3rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    footer p{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    body.route-hero footer{position:fixed;left:0;right:0;bottom:0;background:transparent;border-top:none;z-index:5}
    @media(max-width:900px){
      nav{padding:1rem 1.2rem;background:linear-gradient(to bottom,rgba(247,242,234,.98),rgba(247,242,234,.92))}
      .nav-toggle{display:block}
      .nav-right{gap:.8rem}
      .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:flex-start;gap:1.1rem;background:var(--bg);border-bottom:1px solid var(--line);padding:1.2rem;box-shadow:0 14px 28px rgba(26,18,8,.08)}
      nav.open .nav-links{display:flex}
      section{padding:5rem 1.2rem}.about-grid{grid-template-columns:1fr}.project,.exp-card,.writing-card,.track{grid-template-columns:1fr}.writing-arrow{display:none}footer{padding:1.2rem;flex-direction:column;text-align:center}
    }
    @media(max-width:600px){.hero-name{font-size:3rem}}
  </style>
</head>

  <script>
    var content=JSON.parse(document.getElementById('content-data').textContent);
    var currentLang='en';
    function renderPage(){
      var d=content[currentLang];
      document.documentElement.lang=currentLang;
      document.getElementById('nav-about').textContent=d.nav.about;
      document.getElementById('nav-projects').textContent=d.nav.projects;
      document.getElementById('nav-music').textContent=d.nav.music;
      document.getElementById('nav-writings').textContent=d.nav.writings;
      document.getElementById('nav-experience').textContent=d.nav.experience;
      document.getElementById('nav-skills').textContent=d.nav.skills;
      document.getElementById('nav-contact').textContent=d.nav.contact;
      document.getElementById('hero-eyebrow').textContent=d.hero.eyebrow;
      document.getElementById('hero-tagline').textContent=d.hero.tagline;
      document.getElementById('hero-btn1').textContent=d.hero.btn1;
      document.getElementById('hero-btn2').textContent=d.hero.btn2;
      document.getElementById('about-title').textContent=d.aboutTitle;
      document.getElementById('about-p1').textContent=d.about.p1;
      document.getElementById('about-p2').textContent=d.about.p2;
      document.getElementById('about-p3').textContent=d.about.p3;
      document.getElementById('about-cards').innerHTML=d.cards.map(function(c){return '<div class="card"><div class="card-label">'+c.label+'</div><div class="card-value">'+c.value+'<small>'+c.sub+'</small></div></div>';}).join('');
      document.getElementById('projects-title').textContent=d.projectsTitle;
      document.getElementById('projects-list').innerHTML=d.projects.map(function(p){
        var demo='';
        if(p.demo){demo=p.demo.url?' <a class="status demo" href="'+p.demo.url+'" target="_blank" rel="noopener">'+p.demo.label+' &#8594;</a>':' <span class="status demo-ph">'+p.demo.placeholder+'</span>';}
        var nameHtml=p.slug?'<a href="#projects/'+p.slug+'">'+p.name+'</a>':p.name;
        var more=(p.slug&&p.detail)?'<div><a class="project-more" href="#projects/'+p.slug+'">'+d.projectDetail.more+' &#8594;</a></div>':'';
        return '<article class="project"><div class="project-year">'+p.year+'</div><div><span class="project-tag">'+p.tag+'</span><h3 class="project-name">'+nameHtml+'</h3><p class="project-desc">'+p.desc+'</p><div class="pills">'+p.pills.map(function(x){return '<span class="pill">'+x+'</span>';}).join('')+'</div><span class="status '+p.statusType+'">'+p.status+'</span>'+demo+more+'</div></article>';
      }).join('');
      document.getElementById('music-title').textContent=d.musicTitle;
      document.getElementById('music-intro').textContent=d.music.intro;
      document.getElementById('music-list').innerHTML=d.music.tracks.map(function(t){return '<div class="track"><div class="track-embed">'+(t.embed?t.embed:'<div class="media-ph"><span class="ph-icon">&#9834;</span><span class="ph-main">'+d.music.soon+'</span><span class="ph-sub">'+d.music.embedSub+'</span></div>')+'</div><div><h3 class="track-title">'+t.title+'</h3><p class="track-context">'+t.context+'</p></div></div>';}).join('');
      document.getElementById('writings-title').textContent=d.writingsTitle;
      var wList=document.getElementById('writings-list');
      if(d.writings.length===0){wList.innerHTML='<p style="color:var(--muted);font-family:\'DM Mono\',monospace;font-size:.75rem;letter-spacing:.12em;">'+d.writingsEmpty+'</p>';}
      else{wList.innerHTML=d.writings.map(function(w){return '<a class="writing-card" href="'+w.file+'"><div class="writing-date">'+w.date+'</div><div><span class="writing-tag">'+w.tag+(w.readTime?' &middot; '+w.readTime:'')+'</span><h3 class="writing-title">'+w.title+'</h3><p class="writing-excerpt">'+w.excerpt+'</p>'+(w.abstract?'<p class="writing-abstract">'+w.abstract+'</p>':'')+'</div><div class="writing-arrow">&#8594;</div></a>';}).join('');}
      document.getElementById('experience-title').textContent=d.experienceTitle;
      document.getElementById('experience-list').innerHTML=d.experiences.map(function(e){return '<article class="exp-card"><div class="exp-year">'+e.year+'</div><div><h3 class="exp-title">'+e.title+'</h3><div class="exp-sub">'+e.sub+'</div><p class="exp-desc">'+e.desc+'</p></div></article>';}).join('');
      document.getElementById('skills-title').textContent=d.skillsTitle;
      document.getElementById('skills-grid').innerHTML=d.skillGroups.map(function(g){return '<div class="skill-group"><h3>'+g.title+'</h3>'+g.items.map(function(item){if(typeof item==='string'){return '<div class="skill-item"><span class="skill-name">'+item+'</span></div>';}return '<div class="skill-item"><div class="skill-top"><span class="skill-name">'+item.name+'</span><span class="skill-level">'+item.level+'</span></div></div>';}).join('')+'</div>';}).join('');
      document.getElementById('contact-title').textContent=d.contactTitle;
      document.getElementById('contact-h1').textContent=d.contact.h1;
      document.getElementById('contact-h2').textContent=d.contact.h2;
      document.getElementById('contact-sub').textContent=d.contact.sub;
      document.getElementById('email-label').textContent=d.contact.emailLabel;
      document.getElementById('footer-loc').textContent=d.footer;
      document.getElementById('btn-tr').classList.toggle('active',currentLang==='tr');
      document.getElementById('btn-en').classList.toggle('active',currentLang==='en');
    }
    document.getElementById('btn-tr').addEventListener('click',function(){currentLang='tr';renderPage();showView();});
    document.getElementById('btn-en').addEventListener('click',function(){currentLang='en';renderPage();showView();});
    renderPage();

    /* ── Hash router: her bölüm bir sekme, sayfa yenilenmeden geçiş ── */
    var navEl=document.getElementById('site-nav');
    var viewIds=['hero','about','projects','music','writings','experience','skills','contact'];
    var routeAliases={'':'hero','home':'hero','writing':'writings'};
    function currentRoute(){
      var h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
      var parts=h.split('/');
      var v=routeAliases.hasOwnProperty(parts[0])?routeAliases[parts[0]]:parts[0];
      if(viewIds.indexOf(v)===-1)v='hero';
      return {view:v,detail:parts[1]||null};
    }
    function renderProjectDetail(slug){
      var d=content[currentLang],L=d.projectDetail;
      var el=document.getElementById('project-detail');
      var list=document.getElementById('projects-list');
      var p=null;
      if(slug){for(var i=0;i<d.projects.length;i++){if(d.projects[i].slug===slug){p=d.projects[i];break;}}}
      if(!p||!p.detail){el.innerHTML='';el.style.display='none';list.style.display='';return;}
      list.style.display='none';
      el.style.display='block';
      var demo='';
      if(p.demo){demo=p.demo.url?' <a class="status demo" href="'+p.demo.url+'" target="_blank" rel="noopener">'+p.demo.label+' &#8594;</a>':' <span class="status demo-ph">'+p.demo.placeholder+'</span>';}
      el.innerHTML='<a class="back-btn" href="#projects">'+L.back+'</a>'
        +'<div><span class="project-tag">'+p.tag+'</span></div>'
        +'<h3 class="detail-name">'+p.name+'</h3>'
        +'<div class="pills">'+p.pills.map(function(x){return '<span class="pill">'+x+'</span>';}).join('')+'</div>'
        +'<span class="status '+p.statusType+'">'+p.status+'</span>'+demo
        +'<div class="detail-grid">'
        +'<div><h4 class="detail-label">'+L.overview+'</h4><p>'+p.detail.overview+'</p></div>'
        +'<div><h4 class="detail-label">'+L.role+'</h4><p>'+p.detail.role+'</p></div>'
        +'<div><h4 class="detail-label">'+L.approach+'</h4><p>'+p.detail.approach+'</p></div>'
        +'</div>'
        +'<h4 class="detail-label">'+L.media+'</h4>'
        +'<div class="media-grid">'
        +'<div class="media-ph"><span class="ph-icon">&#10022;</span><span class="ph-main">'+L.soon+'</span><span class="ph-sub">'+L.galleryPh+'</span></div>'
        +'<div class="media-ph"><span class="ph-icon">&#9834;</span><span class="ph-main">'+L.soon+'</span><span class="ph-sub">'+L.audioPh+'</span></div>'
        +'</div>';
    }
    function showView(){
      var r=currentRoute();
      [].forEach.call(document.querySelectorAll('section.view'),function(s){s.classList.toggle('active',s.id===r.view);});
      [].forEach.call(document.querySelectorAll('.nav-links a'),function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+r.view);});
      document.body.className='route-'+r.view;
      renderProjectDetail(r.view==='projects'?r.detail:null);
      navEl.classList.remove('open');
      window.scrollTo(0,0);
    }
    document.getElementById('nav-toggle').addEventListener('click',function(){navEl.classList.toggle('open');});
    window.addEventListener('hashchange',showView);
    showView();
  </script>
